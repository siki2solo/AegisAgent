name: Build & Release Signed APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release-apk:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: Set up Gradle 8.14.4
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.4'

      - name: Read Version Metadata from app/build.gradle.kts
        id: meta
        run: |
          VERSION_NAME=$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          VERSION_CODE=$(grep -m1 'versionCode' app/build.gradle.kts | sed -E 's/[^0-9]*([0-9]+).*/\1/')
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "Resolved release metadata: v$VERSION_NAME (build $VERSION_CODE)"

      - name: Configure Dual-Path PKCS12 Signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          KEYSTORE_FILE="$RUNNER_TEMP/release-keystore.p12"
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "Decoding repository signing keystore secret..."
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"
            echo "RELEASE_KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"
            echo "RELEASE_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "RELEASE_KEY_ALIAS=${ANDROID_KEY_ALIAS:-aegisagent}" >> "$GITHUB_ENV"
            echo "RELEASE_KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"
          else
            echo "ANDROID_KEYSTORE_BASE64 not configured; generating ephemeral RSA-2048 keystore..."
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_FILE" \
              -storetype PKCS12 \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -alias aegisagent \
              -storepass aegisagent-release \
              -keypass aegisagent-release \
              -dname "CN=AegisAgent, OU=Mobile, O=AegisAgent, L=Local, ST=State, C=IN"
            echo "RELEASE_KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"
            echo "RELEASE_KEYSTORE_PASSWORD=aegisagent-release" >> "$GITHUB_ENV"
            echo "RELEASE_KEY_ALIAS=aegisagent" >> "$GITHUB_ENV"
            echo "RELEASE_KEY_PASSWORD=aegisagent-release" >> "$GITHUB_ENV"
          fi

      - name: Assemble Release APK
        run: gradle assembleRelease --no-daemon

      - name: Stage Release Artifact
        run: |
          mkdir -p dist
          APK_OUT="dist/AegisAgent-v${{ steps.meta.outputs.version_name }}-build${{ steps.meta.outputs.version_code }}-release.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK_OUT"
          ls -lh "$APK_OUT"

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AegisAgent-v${{ steps.meta.outputs.version_name }}-build${{ steps.meta.outputs.version_code }}
          path: dist/*.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.meta.outputs.version_name }}
          name: AegisAgent v${{ steps.meta.outputs.version_name }} (Build ${{ steps.meta.outputs.version_code }})
          files: dist/*.apk
          make_latest: true
          generate_release_notes: true
